<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <style>
      .icon-bg { fill: #005a9c; }
      .icon-fg { fill: #ffffff; }
    </style>
  </defs>
  
  <!-- Fondo redondeado -->
  <rect class="icon-bg" width="192" height="192" rx="45"/>
  
  <!-- Icono de contacto (persona + líneas) -->
  <g class="icon-fg">
    <!-- Cabeza -->
    <circle cx="96" cy="52" r="24"/>
    
    <!-- Cuerpo -->
    <path d="M 96 80 Q 70 95 70 120 L 70 140 L 122 140 L 122 120 Q 122 95 96 80 Z"/>
    
    <!-- Líneas de contacto (teléfono/mail estilizado) -->
    <g opacity="0.9">
      <line x1="55" y1="155" x2="85" y2="155" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <line x1="55" y1="170" x2="85" y2="170" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <line x1="107" y1="155" x2="137" y2="155" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <line x1="107" y1="170" x2="137" y2="170" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
